server:
  port: 5001

spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-must-be-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
